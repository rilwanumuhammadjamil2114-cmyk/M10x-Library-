<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Campus Library App</title>
    <style>
        /* --- HYPER-MODERN LIGHT DESIGN SYSTEM --- */
        :root {
            --bg-canvas: #f1f5f9;
            --app-shell: #ffffff;
            --card-bg: #f8fafc;
            --card-border: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --brand-color: #059669; /* Emerald Green */
            --brand-light: #ecfdf5;
            --warning-amber: #d97706;
            --warning-light: #fffbeb;
            --pill-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-canvas);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 0;
        }

        /* Clean, borderless application wrapper that scales beautifully */
        .app-container {
            background-color: var(--app-shell);
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- LOGIN SCREEN VIEW --- */
        .login-view {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 32px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--app-shell);
            z-index: 100;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-header .logo-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 12px;
        }

        .login-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.8px;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: var(--brand-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
        }

        .login-submit-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--brand-color);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
            transition: background 0.2s;
        }

        .login-submit-btn:hover {
            background-color: #047857;
        }

        /* --- MAIN DASHBOARD VIEW (Hidden until auth) --- */
        .dashboard-view {
            display: none;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
        }

        header {
            padding: 32px 24px 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--text-primary);
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .user-profile {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #34d399, #059669);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.2);
        }

        .search-deck {
            padding: 0 24px 20px 24px;
        }

        .search-container {
            position: relative;
        }

        #search-bar {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }

        #search-bar:focus {
            background-color: #ffffff;
            border-color: var(--brand-color);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
        }

        .search-icon-marker {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.5;
        }

        main {
            flex: 1;
            padding: 0 24px 110px 24px; /* Generous bottom padding so text never goes under fixed bar */
        }

        .view-pane {
            display: none;
        }

        .view-pane.active {
            display: block;
        }

        .pane-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        /* Minimalist Book Cards */
        .library-card {
            background: var(--app-shell);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: var(--pill-shadow);
            transition: all 0.2s ease;
        }

        .library-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .book-jacket-spine {
            width: 52px;
            height: 74px;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            box-shadow: 2px 4px 8px rgba(15, 23, 42, 0.06);
        }

        .book-details {
            flex: 1;
        }

        .book-details h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
            line-height: 1.3;
        }

        .book-details p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .status-pill {
            display: inline-flex;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: -0.1px;
        }

        .status-pill.available {
            background-color: var(--brand-light);
            color: var(--brand-color);
        }

        .status-pill.borrowed {
            background-color: var(--warning-light);
            color: var(--warning-amber);
        }

        .action-control {
            background-color: var(--brand-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-control:hover {
            background-color: #047857;
        }

        .action-control:disabled {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .loan-deadline {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 500;
        }
        
        .loan-deadline span {
            color: var(--warning-amber);
            font-weight: 700;
        }

        /* Fixed Navigation Menu Bar (Locks securely to the viewport bottom) */
        .tab-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 432px;
            height: 68px;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.3);
            z-index: 90;
        }

        .tab-trigger {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 75px;
            position: relative;
            transition: color 0.2s;
        }

        .tab-trigger .icon-gfx {
            font-size: 1.2rem;
        }

        .tab-trigger.active {
            color: #34d399;
        }

        .counter-dot {
            position: absolute;
            top: -4px;
            right: 12px;
            background-color: #34d399;
            color: #0f172a;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 800;
        }

        .empty-illustration {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 80px;
            font-size: 0.9rem;
        }

        .empty-illustration .symbol {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- MODULE 1: AUTH ENGINES -->
        <div class="login-view" id="login-screen">
            <div class="login-header">
                <span class="logo-icon">📚</span>
                <h2>Campus Library</h2>
                <p>Sign in with your student dashboard account</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="student-email">Email Address</label>
                    <input type="email" id="student-email" placeholder="alex@university.edu" required>
                </div>
                <div class="form-group">
                    <label for="student-password">Password</label>
                    <input type="password" id="student-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-submit-btn">Authorize Account</button>
            </form>
        </div>

        <!-- MODULE 2: DASHBOARD MANAGEMENT HOOK -->
        <div class="dashboard-view" id="dashboard-screen">
            <header>
                <div>
                    <h1 id="view-title">Discover</h1>
                    <p>Hello, <span id="display-name">Student</span> 👋</p>
                </div>
                <div class="user-profile" id="user-initials">ST</div>
            </header>

            <div class="search-deck" id="search-deck-panel">
                <div class="search-container">
                    <span class="search-icon-marker">🔍</span>
                    <input type="text" id="search-bar" placeholder="Titles, creators, or keywords..." oninput="filterBooks()">
                </div>
            </div>

            <main>
                <!-- Catalog Frame -->
                <section id="catalog-pane" class="view-pane active">
                    <h2 class="pane-title">Available Titles</h2>
                    <div id="book-feed-target"></div>
                </section>

                <!-- Vault View Frame -->
                <section id="loans-pane" class="view-pane">
                    <h2 class="pane-title">Your Current Handouts</h2>
                    <div id="my-vault-target"></div>
                </section>

                <!-- New Dashboard Frame (Left Blank) -->
                <section id="dashboard-pane" class="view-pane">
                    <!-- Placeholder space for future structural metrics -->
                </section>
            </main>

            <!-- Fixed Menu Navigation Deck -->
            <nav class="tab-bar">
                <button class="tab-trigger active" id="trigger-catalog" onclick="changeView('catalog')">
                    <span class="icon-gfx">📖</span>
                    <span>Discover</span>
                </button>
                <button class="tab-trigger" id="trigger-loans" onclick="changeView('loans')">
                    <span class="icon-gfx">🔖</span>
                    <span>My Books</span>
                    <span class="counter-dot" id="shelf-counter">0</span>
                </button>
                <button class="tab-trigger" id="trigger-dashboard" onclick="changeView('dashboard')">
                    <span class="icon-gfx">📊</span>
                    <span>Dashboard</span>
                </button>
            </nav>
        </div>

    </div>

    <script>
        // --- DATA & CORE ENGINE LAYERS ---

        let inventory = [
            { id: "BK001", title: "The Great Gatsby", creator: "F. Scott Fitzgerald", classification: "Fiction", icon: "🍸", state: "Available" },
            { id: "BK002", title: "A Brief History of Time", creator: "Stephen Hawking", classification: "Science", icon: "🌌", state: "Borrowed" },
            { id: "BK003", title: "To Kill a Mockingbird", creator: "Harper Lee", classification: "Fiction", icon: "🌿", state: "Available" },
            { id: "BK004", title: "Introduction to Algorithms", creator: "Thomas H. Cormen", classification: "Tech", icon: "💻", state: "Available" },
            { id: "BK005", title: "Principles of Economics", creator: "N. Gregory Mankiw", classification: "Finance", icon: "📈", state: "Available" }
        ];

        let checkedOutItems = [];

        // Auth Submission Interceptor
        function handleLogin(event) {
            event.preventDefault();
            
            const emailValue = document.getElementById('student-email').value;
            const cleanName = emailValue.split('@')[0].charAt(0).toUpperCase() + emailValue.split('@')[0].slice(1);
            
            document.getElementById('display-name').innerText = cleanName;
            document.getElementById('user-initials').innerText = cleanName.substring(0,2).toUpperCase();

            document.getElementById('login-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'flex';
                populateCatalog(inventory);
            }, 300);
        }

        // Standard Navigation Routing System
        function changeView(targetPane) {
            document.querySelectorAll('.view-pane').forEach(pane => pane.classList.remove('active'));
            document.querySelectorAll('.tab-trigger').forEach(btn => btn.classList.remove('active'));

            const interactiveDeck = document.getElementById('search-deck-panel');
            const titleElement = document.getElementById('view-title');

            if (targetPane === 'catalog') {
                document.getElementById('catalog-pane').classList.add('active');
                document.getElementById('trigger-catalog').classList.add('active');
                interactiveDeck.style.display = "block";
                titleElement.innerText = "Discover";
            } else if (targetPane === 'loans') {
                document.getElementById('loans-pane').classList.add('active');
                document.getElementById('trigger-loans').classList.add('active');
                interactiveDeck.style.display = "none";
                titleElement.innerText = "My Shelf";
                buildVaultView();
            } else if (targetPane === 'dashboard') {
                document.getElementById('dashboard-pane').classList.add('active');
                document.getElementById('trigger-dashboard').classList.add('active');
                interactiveDeck.style.display = "none";
                titleElement.innerText = "Dashboard";
            }
        }

        // Construct Library Feed items
        function populateCatalog(itemsToLoad) {
            const container = document.getElementById('book-feed-target');
            container.innerHTML = '';

            if(itemsToLoad.length === 0) {
                container.innerHTML = `
                    <div class="empty-illustration">
                        <span class="symbol">🌪️</span>
                        <p>No titles match your lookup.</p>
                    </div>`;
                return;
            }

            itemsToLoad.forEach(item => {
                const isReady = item.state === 'Available';
                const pillClass = isReady ? 'available' : 'borrowed';
                
                const frameElement = document.createElement('div');
                frameElement.className = 'library-card';
                frameElement.innerHTML = `
                    <div class="book-jacket-spine">${item.icon}</div>
                    <div class="book-details">
                        <h3>${item.title}</h3>
                        <p>by ${item.creator}</p>
                        <span class="status-pill ${pillClass}">${item.state}</span>
                    </div>
                    <button class="action-control" ${!isReady ? 'disabled' : ''} onclick="processCheckout('${item.id}')">
                        ${isReady ? 'Borrow' : 'Out'}
                    </button>
                `;
                container.appendChild(frameElement);
            });
        }

        // Live Input Search Processing Pipeline
        function filterBooks() {
            const expression = document.getElementById('search-bar').value.toLowerCase();
            const matching = inventory.filter(item => 
                item.title.toLowerCase().includes(expression) || 
                item.creator.toLowerCase().includes(expression) ||
                item.classification.toLowerCase().includes(expression)
            );
            populateCatalog(matching);
        }

        // Transaction Checkout logs
        function processCheckout(idIndex) {
            const recordMatch = inventory.findIndex(target => target.id === idIndex);
            
            if (recordMatch !== -1 && inventory[recordMatch].state === 'Available') {
                inventory[recordMatch].state = 'Borrowed';
                
                const operationalDate = new Date();
                operationalDate.setDate(operationalDate.getDate() + 14);
                
                checkedOutItems.push({
                    title: inventory[recordMatch].title,
                    creator: inventory[recordMatch].creator,
                    icon: inventory[recordMatch].icon,
                    returnDate: operationalDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                });

                document.getElementById('shelf-counter').innerText = checkedOutItems.length;
                filterBooks();
            }
        }

        // Render Checkout inventory to individual profile shelf 
        function buildVaultView() {
            const targetContainer = document.getElementById('my-vault-target');
            targetContainer.innerHTML = '';

            if (checkedOutItems.length === 0) {
                targetContainer.innerHTML = `
                    <div class="empty-illustration">
                        <span class="symbol">📂</span>
                        <p>No books checked out.<br>Your virtual shelf is free.</p>
                    </div>`;
                return;
            }

            checkedOutItems.forEach(loan => {
                const cardBlock = document.createElement('div');
                cardBlock.className = 'library-card';
                cardBlock.innerHTML = `
                    <div class="book-jacket-spine">${loan.icon}</div>
                    <div class="book-details">
                        <h3>${loan.title}</h3>
                        <p>by ${loan.creator}</p>
                        <div class="loan-deadline">Return before: <span>${loan.returnDate}</span></div>
                    </div>
                `;
                targetContainer.appendChild(cardBlock);
            });
        }
    </script>
</body>
</html>
