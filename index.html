<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Student Library App</title>
    <style>
        /* --- MODERN ULTRA-CLEAN STYLING --- */
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Smartphone Container Simulation */
        .app-container {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100%;
            max-width: 412px;
            height: 840px;
            border-radius: 40px;
            border: 8px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Status Bar Notch Space */
        .notch {
            height: 30px;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .notch::before {
            content: '';
            width: 120px;
            height: 15px;
            background: #334155;
            border-radius: 0 0 15px 15px;
        }

        header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Search & Filter Section */
        .search-section {
            padding: 0 24px 16px 24px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        #search-bar {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--surface-color);
            border: 1px solid #334155;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
        }

        #search-bar:focus {
            border-color: var(--accent-color);
        }

        /* Main Content Scrollable Area */
        main {
            flex: 1;
            padding: 0 24px;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        /* Hide Scrollbar for Chrome, Safari and Opera */
        main::-webkit-scrollbar {
            display: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        /* Premium Book Cards */
        .book-card {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            gap: 16px;
            align-items: center;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .book-card:active {
            transform: scale(0.98);
        }

        .book-cover-art {
            width: 50px;
            height: 70px;
            background: linear-gradient(135deg, #334155, #475569);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .book-info {
            flex: 1;
        }

        .book-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2px;
            line-height: 1.3;
        }

        .book-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.available {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .badge.borrowed {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        /* Action Buttons */
        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .action-btn:disabled {
            background-color: #334155;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Loan Specific Style */
        .loan-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        
        .loan-meta strong {
            color: var(--warning);
        }

        /* Bottom Floating Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 76px;
            background-color: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 80px;
            transition: color 0.2s;
        }

        .nav-item span.icon {
            font-size: 1.3rem;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .badge-count {
            position: absolute;
            top: 12px;
            right: 115px;
            background-color: var(--accent-color);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 700;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 60px;
            font-size: 0.9rem;
        }

        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="notch"></div>
        
        <!-- App Header -->
        <header>
            <div>
                <h1 id="app-title-text">Explore Books</h1>
                <p>Welcome back, Alex</p>
            </div>
            <div class="avatar">AS</div>
        </header>

        <!-- Dynamic Search Section (Hidden on My Books tab) -->
        <div class="search-section" id="search-section">
            <div class="search-wrapper">
                <input type="text" id="search-bar" placeholder="Search by title, author, genre..." oninput="filterBooks()">
            </div>
        </div>

        <!-- Main Viewports -->
        <main>
            <!-- Catalog Tab View -->
            <section id="catalog-tab" class="tab-content active">
                <h2 class="section-title">Available in Library</h2>
                <div id="book-list"></div>
            </section>

            <!-- Loans Tab View -->
            <section id="loans-tab" class="tab-content">
                <h2 class="section-title">Your Active Loans</h2>
                <div id="my-loans-list"></div>
            </section>
        </main>

        <!-- Bottom Tab Bar Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-catalog" onclick="switchTab('catalog')">
                <span class="icon">🔍</span>
                <span>Discover</span>
            </button>
            <button class="nav-item" id="nav-loans" onclick="switchTab('loans')">
                <span class="icon">📚</span>
                <span>My Books</span>
                <span class="badge-count" id="loan-count">0</span>
            </button>
        </nav>
    </div>

    <script>
        // --- REACTIVE APPLICATION LOGIC ---

        // Mock Database with extra meta details
        let books = [
            { id: "BK001", title: "The Great Gatsby", author: "F. Scott Fitzgerald", category: "Fiction", emoji: "🍸", status: "Available" },
            { id: "BK002", title: "A Brief History of Time", author: "Stephen Hawking", category: "Science", emoji: "🌌", status: "Borrowed" },
            { id: "BK003", title: "To Kill a Mockingbird", author: "Harper Lee", category: "Fiction", emoji: "🌿", status: "Available" },
            { id: "BK004", title: "Introduction to Algorithms", author: "Thomas H. Cormen", category: "Tech", emoji: "💻", status: "Available" },
            { id: "BK005", title: "Principles of Economics", author: "N. Gregory Mankiw", category: "Finance", emoji: "📈", status: "Available" }
        ];

        let loans = [];

        // Tab Switch Styling & Routing Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

            const searchSec = document.getElementById('search-section');
            const appTitle = document.getElementById('app-title-text');

            if (tabName === 'catalog') {
                document.getElementById('catalog-tab').classList.add('active');
                document.getElementById('nav-catalog').classList.add('active');
                searchSec.style.display = "block";
                appTitle.innerText = "Explore Books";
            } else {
                document.getElementById('catalog-tab').classList.remove('active');
                document.getElementById('loans-tab').classList.add('active');
                document.getElementById('nav-loans').classList.add('active');
                searchSec.style.display = "none";
                appTitle.innerText = "My Digital Bag";
                renderLoans();
            }
        }

        // Render Books dynamically with premium design UI injections
        function renderCatalog(booksToRender) {
            const bookList = document.getElementById('book-list');
            bookList.innerHTML = '';

            if(booksToRender.length === 0) {
                bookList.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🔍</span>
                        <p>No matches found for your search.</p>
                    </div>`;
                return;
            }

            booksToRender.forEach(book => {
                const isAvailable = book.status === 'Available';
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-cover-art">${book.emoji}</div>
                    <div class="book-info">
                        <h3>${book.title}</h3>
                        <p>by ${book.author}</p>
                        <span class="badge ${isAvailable ? 'available' : 'borrowed'}">
                            ${book.status}
                        </span>
                    </div>
                    <button class="action-btn" ${!isAvailable ? 'disabled' : ''} onclick="borrowBook('${book.id}')">
                        ${isAvailable ? 'Get' : 'Out'}
                    </button>
                `;
                bookList.appendChild(card);
            });
        }

        // Search feature engine 
        function filterBooks() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const filtered = books.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.author.toLowerCase().includes(query) ||
                book.category.toLowerCase().includes(query)
            );
            renderCatalog(filtered);
        }

        // Handle structural borrow transactions
        function borrowBook(bookId) {
            const bookIndex = books.findIndex(b => b.id === bookId);
            
            if (bookIndex !== -1 && books[bookIndex].status === 'Available') {
                books[bookIndex].status = 'Borrowed';
                
                const dueDate = new Date();
                dueDate.setDate(dueDate.getDate() + 14);
                
                loans.push({
                    title: books[bookIndex].title,
                    author: books[bookIndex].author,
                    emoji: books[bookIndex].emoji,
                    dueDate: dueDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                });

                document.getElementById('loan-count').innerText = loans.length;
                filterBooks();
            }
        }

        // Render borrowed book wallet view
        function renderLoans() {
            const loansList = document.getElementById('my-loans-list');
            loansList.innerHTML = '';

            if (loans.length === 0) {
                loansList.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📖</span>
                        <p>Your shelf is empty.<br>Go grab some books!</p>
                    </div>`;
                return;
            }

            loans.forEach(loan => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-cover-art">${loan.emoji}</div>
                    <div class="book-info">
                        <h3>${loan.title}</h3>
                        <p>by ${loan.author}</p>
                        <div class="loan-meta">Return by: <strong>${loan.dueDate}</strong></div>
                    </div>
                `;
                loansList.appendChild(card);
            });
        }

        // Init App catalog render
        renderCatalog(books);
    </script>
</body>
</html>
