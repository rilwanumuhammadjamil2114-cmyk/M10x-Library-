<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDUS Handout App</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.page{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

.login-box{
    max-width:350px;
    margin:80px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.nav{
    display:flex;
    background:green;
}

.nav button{
    flex:1;
    border-radius:0;
}

.card{
    background:white;
    margin:10px 0;
    padding:15px;
    border-radius:8px;
}

.portal-btn{
    display:inline-block;
    padding:12px 20px;
    background:green;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="page active">

<div class="login-box">

<h2>Student Login</h2>

<input
id="admission"
placeholder="Admission Number">

<input
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

</div>

<!-- HOME -->

<div id="homePage" class="page">

<div class="nav">

<button onclick="showHandout()">
Handouts
</button>

<button onclick="showPortal()">
University Link
</button>

</div>

<div id="content"></div>

</div>

<script>

function login(){

const admission =
document.getElementById("admission").value.trim();

if(
admission.startsWith("2412") ||
admission.startsWith("2512")
){

document.getElementById("loginPage")
.classList.remove("active");

document.getElementById("homePage")
.classList.add("active");

showHandout();

}else{

alert(
"Admission number must start with 2412 or 2512."
);

}

}

function showHandout(){

document.getElementById("content").innerHTML=`

<div class="card">

<h3>Support the Tech ❤️</h3>

<p><strong>Account Number:</strong> 1920126069</p>

<p><strong>Bank:</strong> Access Bank</p>

</div>

<div class="card">
CMP 202
</div>

<div class="card">
UCSC 203
</div>

<div class="card">
ENT 211
</div>

<div class="card">
IFT 212
</div>

<div class="card">
MTH 202
</div>

`;

}

function showPortal(){

document.getElementById("content").innerHTML=`

<div class="card">

<h2>University Portal</h2>

<p>
Click below to open the official portal.
</p>

<a
class="portal-btn"
href="https://myudusok.edu.ng/landing.php"
target="_blank"
rel="noopener noreferrer">

Open Portal

</a>

</div>

`;

}

</script>

</body>
</html>
