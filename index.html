<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Library</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .app {
            max-width: 480px;
            width: 100%;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        .screen {
            padding: 24px;
            display: none;
        }
        
        .screen.active {
            display: block;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #0f172a;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 32px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .switch {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }
        
        .switch span {
            color: #059669;
            text-decoration: underline;
            cursor: pointer;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
        }
        
        .message.error {
            background: #fef2f2;
            color: #dc2626;
        }
        
        .message.success {
            background: #ecfdf5;
            color: #059669;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .logout-btn {
            width: auto;
            padding: 8px 16px;
            background: #dc2626;
            font-size: 14px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }
        
        .stat-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #0f172a;
        }
        
        .book-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .book-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .book-info p {
            font-size: 14px;
            color: #64748b;
        }
        
        .book-status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 8px;
            background: #ecfdf5;
            color: #059669;
        }
        
        .borrow-btn {
            width: auto;
            padding: 8px 16px;
            background: #059669;
            font-size: 14px;
        }
        
        .return-btn {
            width: auto;
            padding: 8px 16px;
            background: #dc2626;
            font-size: 14px;
        }
        
        .tabs {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 12px;
        }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: none;
            color: #64748b;
        }
        
        .tab.active {
            color: #059669;
        }
        
        .content {
            padding: 24px;
            padding-bottom: 80px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div style="padding: 40px 24px;">
                <h1>📚 Campus Library</h1>
                <p class="subtitle">Sign in to access handouts</p>
                
                <input type="text" id="login-admission" placeholder="Admission Number">
                <input type="password" id="login-password" placeholder="Password">
                <button onclick="login()">Login</button>
                
                <div class="switch">
                    Don't have an account? <span onclick="showRegister()">Create Account</span>
                </div>
                <div id="login-message"></div>
            </div>
        </div>
        
        <!-- Register Screen -->
        <div id="register-screen" class="screen">
            <div style="padding: 40px 24px;">
                <h1>✨ Create Account</h1>
                <p class="subtitle">Join the library</p>
                
                <input type="text" id="reg-admission" placeholder="Admission Number">
                <input type="text" id="reg-name" placeholder="Full Name">
                <input type="password" id="reg-password" placeholder="Password (min 6 chars)">
                <button onclick="register()">Register</button>
                
                <div class="switch">
                    Already have an account? <span onclick="showLogin()">Sign In</span>
                </div>
                <div id="register-message"></div>
            </div>
        </div>
        
        <!-- Dashboard -->
        <div id="dashboard-screen" class="screen">
            <div class="header">
                <div>
                    <h2>Hello, <span id="user-name">Student</span>!</h2>
                    <small id="user-level"></small>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            
            <div class="content">
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">Active Handouts</div>
                        <div class="stat-value" id="active-count">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Status</div>
                        <div class="stat-value" id="status">✅ Good</div>
                    </div>
                </div>
                
                <div id="books-section">
                    <h3>Available Handouts</h3>
                    <div id="books-list"></div>
                </div>
                
                <div id="loans-section" class="hidden">
                    <h3>My Borrowed Handouts</h3>
                    <div id="loans-list"></div>
                </div>
            </div>
            
            <div class="tabs">
                <button class="tab active" onclick="showBooks()">📖 Books</button>
                <button class="tab" onclick="showLoans()">🔖 My Loans</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase config
        const SUPABASE_URL = 'https://ahldahsnznpfxtffzedu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFobGRhaHNuem5wZnh0ZmZ6ZWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzY2MjgsImV4cCI6MjA5NTIxMjYyOH0.ScHI3cNZBiDXYy822AGV1qoEx27M_a_RLBtVmcQSoFQ';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let allBooks = [];
        let userLoans = [];
        
        // Helper functions
        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerHTML = text ? `<div class="message ${type}">${text}</div>` : '';
            }
        }
        
        async function register() {
            const admission = document.getElementById('reg-admission').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            const password = document.getElementById('reg-password').value;
            
            if (!admission || !password) {
                showMessage('register-message', 'Please fill all fields', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('register-message', 'Password must be at least 6 characters', 'error');
                return;
            }
            
            const level = admission.startsWith('25') ? 100 : 200;
            const hashedPassword = btoa(password);
            
            try {
                // Check if user exists
                const { data: existing } = await supabase
                    .from('users')
                    .select('admission_number')
                    .eq('admission_number', admission)
                    .single();
                
                if (existing) {
                    showMessage('register-message', 'User already exists!', 'error');
                    return;
                }
                
                // Create user
                const { error } = await supabase
                    .from('users')
                    .insert([{
                        admission_number: admission,
                        name: name || admission,
                        password: hashedPassword,
                        level: level
                    }]);
                
                if (error) throw error;
                
                showMessage('register-message', '✅ Account created! Please login.', 'success');
                
                setTimeout(() => {
                    showLogin();
                    document.getElementById('register-message').innerHTML = '';
                }, 2000);
                
            } catch (error) {
                showMessage('register-message', 'Error: ' + error.message, 'error');
            }
        }
        
        async function login() {
            const admission = document.getElementById('login-admission').value.trim();
            const password = document.getElementById('login-password').value;
            const hashedPassword = btoa(password);
            
            if (!admission || !password) {
                showMessage('login-message', 'Please enter credentials', 'error');
                return;
            }
            
            try {
                const { data: user, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('admission_number', admission)
                    .eq('password', hashedPassword)
                    .single();
                
                if (error || !user) {
                    showMessage('login-message', 'Invalid credentials', 'error');
                    return;
                }
                
                currentUser = user;
                localStorage.setItem('userId', user.id);
                
                await loadData();
                showDashboard();
                
            } catch (error) {
                showMessage('login-message', 'Error: ' + error.message, 'error');
            }
        }
        
        async function loadData() {
            if (!currentUser) return;
            
            // Load books for user's level
            const { data: books } = await supabase
                .from('books')
                .select('*')
                .eq('level', currentUser.level);
            
            allBooks = books || [];
            
            // Load user's active loans
            const { data: loans } = await supabase
                .from('loans')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('status', 'active');
            
            userLoans = loans || [];
            
            // Update UI
            document.getElementById('user-name').innerText = currentUser.name || currentUser.admission_number;
            document.getElementById('user-level').innerText = `${currentUser.level} Level`;
            document.getElementById('active-count').innerText = userLoans.length;
            
            displayBooks();
            displayLoans();
        }
        
        async function borrowBook(book) {
            if (!currentUser) return;
            
            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + 14);
            
            try {
                // Create loan
                const { error: loanError } = await supabase
                    .from('loans')
                    .insert([{
                        user_id: currentUser.id,
                        book_id: book.id,
                        book_title: book.title,
                        book_code: book.course_code,
                        due_date: dueDate.toISOString()
                    }]);
                
                if (loanError) throw loanError;
                
                // Update available copies
                await supabase
                    .from('books')
                    .update({ available_copies: book.available_copies - 1 })
                    .eq('id', book.id);
                
                await loadData();
                alert('✅ Book borrowed successfully!');
                
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        async function returnBook(loanId, bookId) {
            try {
                await supabase
                    .from('loans')
                    .update({ status: 'returned' })
                    .eq('id', loanId);
                
                const book = allBooks.find(b => b.id === bookId);
                if (book) {
                    await supabase
                        .from('books')
                        .update({ available_copies: book.available_copies + 1 })
                        .eq('id', bookId);
                }
                
                await loadData();
                alert('✅ Book returned successfully!');
                
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function displayBooks() {
            const container = document.getElementById('books-list');
            if (!container) return;
            
            container.innerHTML = '';
            
            allBooks.forEach(book => {
                const isBorrowed = userLoans.some(loan => loan.book_id === book.id);
                const available = book.available_copies > 0 && !isBorrowed;
                
                const bookDiv = document.createElement('div');
                bookDiv.className = 'book-card';
                bookDiv.innerHTML = `
                    <div class="book-info">
                        <h3>${book.course_code}: ${book.title}</h3>
                        <p>${book.creator}</p>
                        <span class="book-status">${isBorrowed ? 'Borrowed' : (book.available_copies + ' copies')}</span>
                    </div>
                    ${available ? `<button class="borrow-btn" onclick="borrowBook(${JSON.stringify(book).replace(/"/g, '&quot;')})">Borrow</button>` : ''}
                `;
                container.appendChild(bookDiv);
            });
            
            if (allBooks.length === 0) {
                container.innerHTML = '<div class="loading">No books available for your level</div>';
            }
        }
        
        function displayLoans() {
            const container = document.getElementById('loans-list');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (userLoans.length === 0) {
                container.innerHTML = '<div class="loading">No borrowed books</div>';
                return;
            }
            
            userLoans.forEach(loan => {
                const dueDate = new Date(loan.due_date);
                const isOverdue = dueDate < new Date();
                
                const loanDiv = document.createElement('div');
                loanDiv.className = 'book-card';
                loanDiv.innerHTML = `
                    <div class="book-info">
                        <h3>${loan.book_code}: ${loan.book_title}</h3>
                        <p>Due: ${dueDate.toLocaleDateString()} ${isOverdue ? '(Overdue!)' : ''}</p>
                    </div>
                    <button class="return-btn" onclick="returnBook('${loan.id}', ${loan.book_id})">Return</button>
                `;
                container.appendChild(loanDiv);
            });
        }
        
        function showBooks() {
            document.getElementById('books-section').classList.remove('hidden');
            document.getElementById('loans-section').classList.add('hidden');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            displayBooks();
        }
        
        function showLoans() {
            document.getElementById('books-section').classList.add('hidden');
            document.getElementById('loans-section').classList.remove('hidden');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            displayLoans();
        }
        
        function showDashboard() {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('register-screen').classList.remove('active');
            document.getElementById('dashboard-screen').classList.add('active');
        }
        
        function showLogin() {
            document.getElementById('login-screen').classList.add('active');
            document.getElementById('register-screen').classList.remove('active');
            document.getElementById('dashboard-screen').classList.remove('active');
        }
        
        function showRegister() {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('register-screen').classList.add('active');
            document.getElementById('dashboard-screen').classList.remove('active');
        }
        
        function logout() {
            currentUser = null;
            localStorage.removeItem('userId');
            showLogin();
            document.getElementById('login-admission').value = '';
            document.getElementById('login-password').value = '';
        }
        
        // Check for existing session
        async function checkSession() {
            const userId = localStorage.getItem('userId');
            if (userId) {
                const { data: user } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', userId)
                    .single();
                
                if (user) {
                    currentUser = user;
                    await loadData();
                    showDashboard();
                }
            }
        }
        
        // Start app
        checkSession();
    </script>
</body>
</html>
